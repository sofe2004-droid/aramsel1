# Render Blueprint — GitHub 저장소를 Render에 연결하면 이 설정으로 자동 배포됩니다.
# https://render.com → New → Blueprint → 이 저장소 선택
services:
  - type: web
    name: ai-emotion-python-learning
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      # PostgreSQL 접속 주소 — Neon/Supabase 등에서 발급받아 Render 대시보드에 입력
      # (설정하면 파일 대신 DB에 저장되어 재배포·절전에도 데이터가 보존됩니다)
      - key: DATABASE_URL
        sync: false
      # OpenAI 챗봇 키 — Render 대시보드에서 직접 입력 (코드/깃에 올리지 않음)
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      # 교사 대시보드 비밀번호 — Render 대시보드에서 직접 입력
      - key: ADMIN_PW
        sync: false
      - key: NODE_VERSION
        value: "20"
