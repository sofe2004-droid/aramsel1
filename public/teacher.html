<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>교사 대시보드</title>
<link rel="stylesheet" href="css/style.css">
<script>
  // 비밀번호 인증 없이 직접 접속하면 로그인 화면으로 되돌림
  if (sessionStorage.getItem('teacherAuthed') !== '1') {
    location.replace('index.html');
  }
</script>
</head>
<body>
<div class="app-header">
  <div>
    <h1>교사 대시보드</h1>
    <div class="sub">AI 정서지원 기반 학습지원 프로그램 · 실험집단 모니터링</div>
  </div>
  <button class="btn btn-outline" style="background:rgba(255,255,255,0.15); color:#fff; border-color:#fff;" onclick="sessionStorage.removeItem('teacherAuthed'); location.href='index.html'">나가기</button>
</div>

<!-- 🚨 정서 이상 학생 경고 (최상단 배너) -->
<div id="riskBanner" class="risk-banner" style="display:none;"></div>

<div class="container">
  <!-- 반/학번 검색 -->
  <div class="card filter-card">
    <div class="filter-row">
      <div class="filter-group">
        <span class="filter-label">반 검색</span>
        <div id="classFilter" class="class-filter"></div>
      </div>
      <div class="filter-group">
        <span class="filter-label">학번 검색</span>
        <div class="search-box">
          <input type="text" id="studentSearch" inputmode="numeric" maxlength="5" placeholder="학번 5자리 (예: 20601)">
          <button class="btn btn-primary" id="searchBtn">검색</button>
          <button class="btn btn-outline" id="clearSearchBtn" style="display:none;">전체보기</button>
        </div>
      </div>
    </div>
    <div id="scopeLabel" class="scope-label"></div>
  </div>

  <!-- 학급별 학습현황 (전체 보기일 때 반별 비교) -->
  <div class="card" id="classCompareCard">
    <h3>🏫 학급별 학습현황</h3>
    <div id="classCompare"><p class="muted">불러오는 중...</p></div>
  </div>

  <!-- 핵심 지표 (선택 범위) -->
  <div class="card">
    <h3 id="kpiTitle">📊 학습 지표</h3>
    <div id="kpiTiles" class="summary-grid"></div>
  </div>

  <!-- 차시별 이수율 -->
  <div class="card">
    <h3>✅ 차시별 이수율</h3>
    <div id="completionBars"></div>
  </div>

  <!-- 감정 변화 추이 -->
  <div class="card">
    <h3>📈 차시별 감정 변화 추이</h3>
    <p class="muted">차시가 진행될수록 긍정/부정 정서가 어떻게 변하는지 보여줍니다.</p>
    <div id="emotionTrend" style="overflow-x:auto;"></div>
  </div>

  <!-- 학생 목록 -->
  <div class="card">
    <h3 id="studentListTitle">👩‍🎓 학생 목록</h3>
    <p class="muted">행을 클릭하면 학생별 상세(정서 변화·코드·AI 피드백·성찰)를 볼 수 있어요.</p>
    <div style="overflow-x:auto;">
      <table id="studentTable"></table>
    </div>
  </div>

  <div class="card" id="detailCard" style="display:none;">
    <h3 id="detailTitle"></h3>
    <div id="detailBody"></div>
  </div>
</div>

<script src="js/teacher.js"></script>
</body>
</html>
